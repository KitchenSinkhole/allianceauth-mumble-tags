[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "allianceauth-mumble-tags"
version = "1.0.0"
description = "Append group-based tags to Mumble display names in Alliance Auth 5"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["allianceauth>=5.0.0,<6"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/KitchenSinkhole/allianceauth-mumble-tags"
Issues = "https://github.com/KitchenSinkhole/allianceauth-mumble-tags/issues"
Changelog = "https://github.com/KitchenSinkhole/allianceauth-mumble-tags/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["mumbletags*"]
